line-length = 100
target-version = "py312"
extend-exclude = ["docs"]
force-exclude = true

[lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # isort
    "I",
    # pyupgrade
    "UP",
    # absolute imports only
    "TID252",
    ## flake8-bugbear
    # "B",
    # flake8-simplify
    "SIM",
]

[format]
indent-style = "space"

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: \.(svg|csv)$
      - id: trailing-whitespace
        exclude: \.(svg|csv)$

  # Ruff replaces isort, pyupgrade and absolufy-imports (see ruff.toml: I, UP, TID252)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty has no official hook repo; run it from the project env so third-party types resolve
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --frozen ty check --exclude=docs/
        language: system
        types: [python]
        pass_filenames: false
